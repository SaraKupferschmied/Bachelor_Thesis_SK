services:
  db:
    image: postgres:16
    container_name: ba_thesis_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer
    container_name: ba_thesis_adminer_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: >
      sh -c "echo 'Adminer reachable via http://localhost:8080';
      exec php -S 0.0.0.0:8080 -t /var/www/html"
    depends_on:
      - db

  db_init:
    image: node:20
    container_name: ba_thesis_db_init_dev
    working_dir: /app
    volumes:
      - ./DB_service:/app
    #security fallback in case node_modules dont work
    command: sh -lc "npm ci && npm run schema:once"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["jobs"]

  import_data:
    image: node:20
    container_name: ba_thesis_import_data_dev
    working_dir: /app
    volumes:
      - ./DB_service:/app
      - ./scrapy_crawler:/scrapy_crawler
      - ./scrapy_crawler:/app/scrapy_crawler
    command: sh -lc "npm ci && npm run import:all"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CRAWLER_ROOT: /scrapy_crawler
    depends_on:
      db:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    profiles: ["jobs"]

  backend:
    build:
      context: ./backend_api
    container_name: ba_thesis_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend_api:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  chatbot:
    build:
      context: ./chatbot
    container_name: ba_thesis_chatbot
    ports:
      - "8000:8000"
    environment:
      BACKEND_API_BASE: http://backend:3000
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1
      RAG_PARSER: docling_table_semantic
      VECTORSTORE_DIR: /app/vectorstore
    volumes:
      - ./chatbot:/app
      - ./scrapy_crawler:/scrapy_crawler
    depends_on:
      - backend

  frontend:
    image: node:20-alpine
    container_name: ba_thesis_frontend_dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"
    depends_on:
      - chatbot

  info:
    image: alpine
    container_name: ba_thesis_info
    command: >
      sh -c "echo '🚀 Usefull Links (may need reload):';
      echo '📄Chatbot Swagger: http://localhost:8000/docs';
      echo '📄Backend API: http://localhost:3000/docs';
      echo '🗄️ Adminer: http://localhost:8080';
      echo '🌐 Frontend: http://localhost:4200';
      sleep infinity"
    depends_on:
      - chatbot
      - backend
      - adminer
      - frontend

volumes:
  pgdata:
  backend_node_modules:
