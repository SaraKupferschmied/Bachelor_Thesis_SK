services:
  db:
    image: postgres:16
    container_name: bachelor_thesis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
 
  adminer:
    image: adminer
    container_name: bachelor_thesis_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: >
      sh -c "echo 'Adminer reachable via http://localhost:8080';
      exec php -S 0.0.0.0:8080 -t /var/www/html"
    depends_on:
      - db
 
  db_init:
    image: node:20
    container_name: bachelor_thesis_db_init
    working_dir: /app
    volumes:
      - ./DB_service:/app
      - db_service_node_modules:/app/node_modules
    #security fallback in case node_modules dont work
    command: sh -lc "npm ci && npm run schema:once"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["jobs"]
 
  import_data:
    image: node:20
    container_name: bachelor_thesis_import_data
    working_dir: /app
    volumes:
      - ./DB_service:/app
      - db_service_node_modules:/app/node_modules
      - ./scrapy_crawler:/scrapy_crawler
      - ./scrapy_crawler:/app/scrapy_crawler
    command: sh -lc "npm ci && npm run import:all"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CRAWLER_ROOT: /scrapy_crawler
      DOCLING_PARSED_DIR: /scrapy_crawler/outputs/parsed_fulltext_docling_new2
      COURSES_JSON_PATH: /scrapy_crawler/scrapy_crawler/spider_outputs/courses.json
    depends_on:
      db:
        condition: service_healthy
    profiles: ["jobs"]
 
  backend:
    build:
      context: ./backend_api
    container_name: bachelor_thesis_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend_api:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
 
  ollama:
    image: ollama/ollama
    container_name: bachelor_thesis_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
        ollama serve &
        sleep 5 &&
        ollama pull llama3.1 &&
        ollama pull nomic-embed-text &&
        wait
      "

  chatbot:
    build:
      context: ./chatbot
    container_name: bachelor_thesis_chatbot
    ports:
      - "8000:8000"
    environment:
      BACKEND_API_BASE: http://backend:3000
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.1
      RAG_PARSER: docling_table_semantic
      VECTORSTORE_DIR: /app/vectorstore
    volumes:
      - ./chatbot:/app
      - ./scrapy_crawler:/scrapy_crawler
    depends_on:
      - backend
      - ollama
 
  frontend:
    image: node:20-alpine
    container_name: bachelor_thesis_frontend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "npm install && npm run start -- --host 0.0.0.0 --port 4200 --poll 1000"
    depends_on:
      - chatbot
      - backend
 
  info:
    image: alpine
    container_name: bachelor_thesis_info
    command: >
      sh -c "echo '🚀 Usefull Links (may need reload):';
      echo '📄Chatbot Swagger: http://localhost:8000/docs';
      echo '📄Backend API: http://localhost:3000/docs';
      echo '🗄️ Adminer: http://localhost:8080';
      echo '🌐 Frontend: http://localhost:4200';
      sleep infinity"
    depends_on:
      - chatbot
      - backend
      - adminer
      - frontend
 
volumes:
  pgdata:
  backend_node_modules:
  db_service_node_modules:
  ollama_data:
  frontend_node_modules: