<form class="chat-input" (ngSubmit)="send()">
  <textarea
    #messageBox
    [(ngModel)]="message"
    name="message"
    [placeholder]="dictionary().messagePlaceholder"
    rows="1"
    (input)="autoResize(messageBox)"
    (keydown.enter)="handleEnter($event, messageBox)"
  ></textarea>

  <button type="submit" [attr.aria-label]="dictionary().sendLabel">➤</button>
</form>
