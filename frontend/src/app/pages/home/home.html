<div class="layout">
  <app-plans-sidebar
    [plans]="plans"
    [activePlanId]="activePlanId">
  </app-plans-sidebar>

  <main class="main">
    <header class="page-header">
      <div>
        <h1>Semesterplanungs-Assistent</h1>
        <p>Lass uns dein Semester gemeinsam planen</p>
      </div>
    </header>

    <section class="hero">
      <div class="hero__icon">✦</div>
      <h2>Willkommen bei deinem Studienplaner!</h2>
      <p>Wähle eine der folgenden Optionen oder stelle mir eine Frage</p>

      <div class="options">
        @for (option of options; track option.title) {
          <app-option-card
            [icon]="option.icon"
            [title]="option.title"
            [description]="option.description"
            [borderColor]="option.borderColor">
          </app-option-card>
        }
      </div>
    </section>

    <footer class="composer">
      <app-chat-input></app-chat-input>
    </footer>
  </main>
</div>
